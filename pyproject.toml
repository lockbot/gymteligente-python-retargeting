[project]
name = "gymteligente-python-retargeting"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "mediapipe>=1.0.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.3",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
